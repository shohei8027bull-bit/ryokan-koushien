<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採用一元管理システム | ひふみ旅館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700;900&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #0D1F3C;
  --navy2:  #142A4E;
  --gold:   #C9A84C;
  --gold2:  #E8C96D;
  --cream:  #FAF6EE;
  --red:    #A82020;
  --white:  #FFFFFF;
  --gray:   #7C8598;
  --light:  #F3EDE0;
  --line:   rgba(13,31,60,0.10);
  --ok:     #2F8F5B;
  --warn:   #C7871F;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
  --serif: 'Zen Old Mincho', 'Noto Serif JP', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--navy);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: inherit; }

/* ===== LAYOUT ===== */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  background: var(--navy);
  color: rgba(255,255,255,0.75);
  padding: 26px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(201,168,76,0.2);
}
.brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-jp {
  font-family: var(--serif);
  font-size: 19px; font-weight: 900;
  color: var(--gold); letter-spacing: 0.18em; display: block;
}
.brand-sub {
  font-size: 10px; letter-spacing: 0.16em;
  color: rgba(255,255,255,0.4); margin-top: 6px;
}
.nav { padding: 18px 12px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 8px;
  font-size: 13px; letter-spacing: 0.05em;
  color: rgba(255,255,255,0.72);
  background: none; border: none; width: 100%; text-align: left;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
.nav-item.active { background: rgba(201,168,76,0.15); color: var(--gold2); }
.nav-item .ico { width: 18px; height: 18px; flex: 0 0 18px; }
.nav-item .ico svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav-badge {
  margin-left: auto; font-size: 11px; min-width: 20px; text-align: center;
  background: rgba(201,168,76,0.2); color: var(--gold2);
  border-radius: 20px; padding: 1px 7px;
}
.sidebar-foot {
  padding: 16px 24px 0; border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); line-height: 1.9;
}

/* ===== MAIN ===== */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 0 32px; height: 68px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}
.topbar h1 {
  font-family: var(--serif); font-size: 21px; font-weight: 900;
  letter-spacing: 0.06em; color: var(--navy);
}
.topbar-sub { font-size: 11px; color: var(--gray); letter-spacing: 0.14em; margin-top: 2px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--cream); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; width: 230px;
}
.search-box input { border: none; background: none; outline: none; font-size: 13px; width: 100%; color: var(--navy); }
.search-box svg { width: 15px; height: 15px; stroke: var(--gray); fill: none; stroke-width: 1.8; flex: 0 0 15px; }

.content { padding: 32px; flex: 1; max-width: 1240px; width: 100%; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 18px; border-radius: 8px; border: none;
  font-size: 13px; letter-spacing: 0.06em; font-weight: 700;
  transition: all 0.18s; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; }
.btn-primary { background: var(--gold); color: var(--navy); }
.btn-primary:hover { background: var(--gold2); box-shadow: 0 6px 18px rgba(201,168,76,0.3); transform: translateY(-1px); }
.btn-navy { background: var(--navy); color: var(--white); }
.btn-navy:hover { background: var(--navy2); transform: translateY(-1px); }
.btn-outline { background: var(--white); color: var(--navy); border: 1px solid var(--line); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-ghost { background: none; color: var(--gray); padding: 8px 12px; }
.btn-ghost:hover { color: var(--navy); background: var(--cream); }
.btn-danger { background: none; color: var(--red); border: 1px solid rgba(168,32,32,0.25); }
.btn-danger:hover { background: rgba(168,32,32,0.07); }
.btn-sm { padding: 7px 12px; font-size: 12px; }

/* ===== HEAD ===== */
.section-label { font-size: 10px; letter-spacing: 0.34em; color: var(--gold); font-weight: 700; }
.section-title { font-family: var(--serif); font-size: 26px; font-weight: 900; letter-spacing: 0.05em; margin-top: 6px; }

/* ===== KPI CARDS ===== */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.kpi {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  padding: 22px; position: relative; overflow: hidden;
}
.kpi::after {
  content: ''; position: absolute; top: -30px; right: -30px;
  width: 90px; height: 90px; border-radius: 50%;
  border: 1px solid rgba(201,168,76,0.15);
}
.kpi-label { font-size: 11px; letter-spacing: 0.14em; color: var(--gray); margin-bottom: 12px; }
.kpi-value { font-family: var(--serif); font-size: 38px; font-weight: 900; line-height: 1; color: var(--navy); }
.kpi-value small { font-size: 15px; font-weight: 700; color: var(--gray); margin-left: 4px; }
.kpi-foot { font-size: 11px; color: var(--gray); margin-top: 10px; }
.kpi-foot b { color: var(--ok); }

/* ===== CARD / PANEL ===== */
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
}
.panel-head h3 { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: 0.05em; }
.panel-head .sub { font-size: 11px; color: var(--gray); margin-top: 3px; letter-spacing: 0.08em; }
.panel-body { padding: 6px 22px 10px; }

.two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }

/* ===== TABLE ===== */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; color: var(--gray);
  font-weight: 700; padding: 13px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl th.num, .tbl td.num { text-align: right; }
.tbl td { padding: 14px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.clickable { transition: background 0.12s; }
.tbl tr.clickable:hover { background: var(--cream); cursor: pointer; }
.tbl .strong { font-weight: 700; }

/* ===== BADGE / STATUS ===== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; letter-spacing: 0.05em; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-active { background: rgba(47,143,91,0.12); color: var(--ok); }
.b-paused { background: rgba(124,133,152,0.14); color: var(--gray); }
.b-open { background: rgba(47,143,91,0.12); color: var(--ok); }
.b-closed { background: rgba(168,32,32,0.10); color: var(--red); }
.s-new { background: rgba(201,168,76,0.18); color: #9c7f2e; }
.s-screening { background: rgba(20,42,78,0.10); color: var(--navy); }
.s-interview { background: rgba(199,135,31,0.15); color: var(--warn); }
.s-offer { background: rgba(47,143,91,0.15); color: var(--ok); }
.s-rejected { background: rgba(124,133,152,0.14); color: var(--gray); }
.kind-tag { font-size: 10px; letter-spacing: 0.05em; color: var(--gray); background: var(--cream); border: 1px solid var(--line); padding: 2px 9px; border-radius: 6px; white-space: nowrap; }

/* avatar */
.avatar {
  width: 38px; height: 38px; border-radius: 9px; flex: 0 0 38px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-weight: 900; font-size: 17px; color: var(--white);
}
.cell-facility { display: flex; align-items: center; gap: 11px; }
.cell-facility .meta .nm { font-weight: 700; font-size: 13px; }

/* ===== CHANNEL GRID ===== */
.filters { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.chip {
  padding: 8px 16px; border-radius: 20px; font-size: 12px; letter-spacing: 0.05em;
  background: var(--white); border: 1px solid var(--line); color: var(--gray); font-weight: 700;
  transition: all 0.15s;
}
.chip:hover { border-color: var(--gold); color: var(--navy); }
.chip.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

.ch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.ch-card {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
  display: flex; flex-direction: column;
}
.ch-card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(13,31,60,0.12); }
.ch-card-top { padding: 20px 20px 14px; display: flex; align-items: flex-start; gap: 13px; }
.ch-card-top .avatar { width: 44px; height: 44px; flex-basis: 44px; border-radius: 11px; font-size: 19px; }
.ch-card-name { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: 0.03em; }
.ch-card-kind { margin-top: 6px; }
.ch-card-cost { padding: 0 20px 14px; font-size: 12px; color: var(--gray); }
.ch-card-cost b { font-family: var(--serif); font-size: 17px; color: var(--navy); font-weight: 900; }
.ch-card-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line);
  margin-top: auto;
}
.ch-card-stat { padding: 13px 6px; text-align: center; }
.ch-card-stat + .ch-card-stat { border-left: 1px solid var(--line); }
.ch-card-stat .n { font-family: var(--serif); font-size: 20px; font-weight: 900; }
.ch-card-stat .l { font-size: 10px; color: var(--gray); letter-spacing: 0.06em; margin-top: 2px; }
.ch-card-cpa { padding: 11px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--gray); }
.ch-card-cpa b { color: var(--navy); font-size: 13px; }

/* ===== DETAIL ===== */
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray); margin-bottom: 16px; }
.breadcrumb a { color: var(--gold); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.detail-hero {
  background: var(--navy); color: var(--white); border-radius: 14px;
  padding: 28px 32px; display: flex; align-items: center; gap: 22px; margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.detail-hero::before {
  content: ''; position: absolute; top: -50px; right: -20px; width: 180px; height: 180px;
  border-radius: 50%; border: 1px solid rgba(201,168,76,0.2);
}
.detail-hero .avatar { width: 60px; height: 60px; flex-basis: 60px; border-radius: 14px; font-size: 25px; }
.detail-hero h2 { font-family: var(--serif); font-size: 25px; font-weight: 900; letter-spacing: 0.05em; }
.detail-hero .area { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 6px; letter-spacing: 0.08em; }
.detail-hero-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; z-index: 1; }
.detail-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.dm { background: var(--white); border: 1px solid var(--line); border-radius: 11px; padding: 18px; }
.dm .l { font-size: 11px; color: var(--gray); margin-bottom: 8px; }
.dm .v { font-family: var(--serif); font-size: 26px; font-weight: 900; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; flex-wrap: wrap; }
.tab {
  padding: 12px 20px; font-size: 13px; letter-spacing: 0.05em; font-weight: 700;
  color: var(--gray); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--navy); }
.tab.active { color: var(--navy); border-bottom-color: var(--gold); }
.tab .cnt { color: var(--gray); font-weight: 400; margin-left: 5px; }

/* job row */
.job-row {
  border: 1px solid var(--line); border-radius: 11px; padding: 18px 22px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 18px; background: var(--white); transition: border-color 0.15s;
}
.job-row:hover { border-color: var(--gold); }
.job-row .jinfo { flex: 1; min-width: 0; }
.job-row .jtitle { font-family: var(--serif); font-size: 17px; font-weight: 700; letter-spacing: 0.03em; }
.job-tags { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
.job-tag { font-size: 11px; color: var(--gray); background: var(--cream); border: 1px solid var(--line); padding: 3px 10px; border-radius: 6px; }
.job-tag.salary { color: var(--navy); font-weight: 700; }
.job-ch-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.job-chs { display: flex; gap: 5px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.job-chs .lbl { font-size: 10px; color: var(--gray); letter-spacing: 0.06em; }
.job-ch-pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--cream); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
.job-row .jstat { display: flex; align-items: center; gap: 14px; }
.job-row .japps { text-align: center; }
.job-row .japps .n { font-family: var(--serif); font-size: 22px; font-weight: 900; }
.job-row .japps .l { font-size: 10px; color: var(--gray); }

/* ===== PIPELINE ===== */
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.pipe-col { background: var(--cream); border-radius: 11px; padding: 12px; min-height: 200px; }
.pipe-col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 12px; }
.pipe-col-head .c { font-size: 11px; color: var(--gray); background: var(--white); border-radius: 20px; padding: 1px 9px; }
.pipe-card {
  background: var(--white); border: 1px solid var(--line); border-radius: 9px;
  padding: 12px; margin-bottom: 9px; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
  border-left: 3px solid var(--gold);
}
.pipe-card:hover { box-shadow: 0 6px 16px rgba(13,31,60,0.1); transform: translateY(-2px); }
.pipe-card .nm { font-weight: 700; font-size: 13.5px; }
.pipe-card .jb { font-size: 11px; color: var(--gray); margin-top: 4px; }
.pipe-card .src { font-size: 10px; margin-top: 8px; display: flex; align-items: center; gap: 5px; color: var(--gray); }
.pipe-empty { font-size: 11px; color: var(--gray); text-align: center; padding: 20px 0; }

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center; padding: 66px 24px; background: var(--white);
  border: 1px dashed rgba(201,168,76,0.45); border-radius: 12px;
}
.empty svg { width: 44px; height: 44px; stroke: var(--gold); fill: none; stroke-width: 1.4; margin-bottom: 16px; }
.empty h4 { font-family: var(--serif); font-size: 18px; margin-bottom: 8px; }
.empty p { font-size: 13px; color: var(--gray); line-height: 1.9; margin-bottom: 20px; }

/* ===== MODAL ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(13,31,60,0.55); backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px;
  z-index: 200; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--cream); border-radius: 16px; width: 100%; max-width: 620px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4); transform: translateY(14px); transition: transform 0.2s;
  overflow: hidden;
}
.overlay.show .modal { transform: translateY(0); }
.modal-head {
  background: var(--navy); color: var(--white); padding: 22px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
.modal-head .sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; letter-spacing: 0.1em; }
.modal-close { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 26px; line-height: 1; padding: 0 4px; }
.modal-close:hover { color: var(--white); }
.modal-body { padding: 26px 28px; max-height: 62vh; overflow-y: auto; }
.modal-foot { padding: 18px 28px; background: var(--white); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 7px; color: var(--navy); }
.field label .req { color: var(--red); margin-left: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 13.5px; background: var(--white); color: var(--navy); outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.7; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field .hint { font-size: 11px; color: var(--gray); margin-top: 6px; }
.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 32px; height: 32px; border-radius: 8px; border: 2px solid transparent; }
.color-swatch.sel { border-color: var(--navy); box-shadow: 0 0 0 2px var(--white) inset; }
.check-list { display: flex; flex-direction: column; gap: 8px; }
.check-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--white); cursor: pointer; font-size: 13px;
  transition: border-color 0.15s;
}
.check-item:hover { border-color: var(--gold); }
.check-item.on { border-color: var(--gold); background: rgba(201,168,76,0.06); }
.check-item input { width: auto; }
.check-item .ci-dot { width: 10px; height: 10px; border-radius: 3px; }

/* ===== SETTINGS ===== */
.settings-row {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 20px 0; border-bottom: 1px solid var(--line);
}
.settings-row:last-child { border-bottom: none; }
.settings-row .info h4 { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
.settings-row .info p { font-size: 12px; color: var(--gray); line-height: 1.7; }

/* ===== TOAST ===== */
.toast-wrap { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast {
  background: var(--navy); color: var(--white); padding: 13px 24px; border-radius: 10px;
  font-size: 13px; letter-spacing: 0.04em; box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  display: flex; align-items: center; gap: 10px; animation: toastIn 0.25s ease;
  border-left: 3px solid var(--gold);
}
.toast svg { width: 16px; height: 16px; stroke: var(--gold2); fill: none; stroke-width: 2; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.bar-row .bl { font-size: 12px; font-weight: 700; width: 120px; flex: 0 0 120px; display: flex; align-items: center; gap: 7px; }
.bar-row .bt { flex: 1; height: 8px; background: var(--light); border-radius: 20px; overflow: hidden; }
.bar-row .bt > div { height: 100%; border-radius: 20px; }
.bar-row .bn { font-size: 12px; color: var(--gray); width: 44px; text-align: right; }

/* ===== CONNECTION / API ===== */
.conn-pill { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--gray); background:var(--cream); border:1px solid var(--line); padding:6px 12px; border-radius:20px; white-space:nowrap; }
.conn-pill .cd { width:7px; height:7px; border-radius:50%; background:var(--gray); }
.conn-pill.on { color:var(--ok); border-color:rgba(47,143,91,.3); background:rgba(47,143,91,.08); }
.conn-pill.on .cd { background:var(--ok); box-shadow:0 0 0 3px rgba(47,143,91,.15); }
.conn-info { background:var(--white); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
.ci-h { font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--gray); margin-bottom:8px; }
.ci-row { display:flex; align-items:center; gap:8px; }
.conn-info code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--navy); word-break:break-all; flex:1; }

.mobile-only { display: none; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1080px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .ch-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: repeat(2, 1fr); }
  .detail-metrics { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 150;
    transform: translateX(-100%); transition: transform 0.25s;
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-only { display: inline-flex; }
  .content { padding: 20px; }
  .topbar { padding: 0 18px; }
  .topbar h1 { font-size: 16px; }
  .search-box { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .ch-grid { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: 1fr; }
  .detail-hero { flex-direction: column; align-items: flex-start; }
  .detail-hero-actions { margin-left: 0; }
  .field-row { grid-template-columns: 1fr; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 140; }
}
</style>
</head>

<script>
/* ============================================================
   ひふみ旅館 採用一元管理システム
   複数の求人媒体（チャネル）を横断し、応募を1つのパイプラインに集約
   単体HTML / 依存なし / localStorage 永続化
   ============================================================ */

const STORE_KEY = 'hifumi_saiyo_v1';
const PALETTE = ['#2557A7','#FF6A6A','#00A4BD','#F2994A','#0D1F3C','#6C5CE7','#2F8F5B','#A82020'];
const KINDS = ['有料求人媒体','無料求人媒体','自社採用サイト','ハローワーク','リファラル（紹介）'];
const EMP_TYPES = ['正社員','契約社員','パート・アルバイト','業務委託'];
const STATUS = {
  new:       { label: '新規',     cls: 's-new' },
  screening: { label: '書類選考', cls: 's-screening' },
  interview: { label: '面接',     cls: 's-interview' },
  offer:     { label: '内定',     cls: 's-offer' },
  rejected:  { label: '見送り',   cls: 's-rejected' },
};
const STATUS_ORDER = ['new','screening','interview','offer','rejected'];
const CH_STATUS = { active: { label: '掲載中', cls: 'b-active' }, paused: { label: '停止中', cls: 'b-paused' } };
const CONNECTORS = {
  'manual':          { label: '手動入力', auto: false },
  'self-site':       { label: '自社採用サイト（フォーム直結）', auto: true },
  'indeed':          { label: 'Indeed Apply', auto: true },
  'generic-webhook': { label: '汎用Webhook', auto: true },
};

/* ---------- state ---------- */
let state = { seq: 1, ryokan: { name: 'ひふみ旅館', area: '', copy: '' }, channels: [], jobs: [], apps: [] };
let view = 'dashboard';
let currentChId = null;
let currentTab = 'apps';
let searchTerm = '';
let chFilter = 'all';
let appChFilter = 'all';
let apiMode = false;
let pollTimer = null;

/* ---------- persistence ---------- */
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); if (apiMode) pushState(); }
function load() {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) { try { state = JSON.parse(raw); return true; } catch(e){} }
  return false;
}
function uid(p) { return p + '_' + (state.seq++).toString(36) + Date.now().toString(36).slice(-3); }

/* ---------- seed ---------- */
function seed() {
  state = { seq: 1, ryokan: { name: 'ひふみ旅館', area: '京都府・京都駅前', copy: '京都駅から徒歩5分。国内外のお客様を和のおもてなしでお迎えする町家旅館です。スタッフの笑顔がいちばんのおもてなしです。' }, channels: [], jobs: [], apps: [] };
  const ch = (name, kind, status, cost, color, connector, config) => { const c = { id: uid('c'), name, kind, status, cost, color, note:'', connector: connector||'manual', config: config||{} }; state.channels.push(c); return c.id; };
  const cIndeed = ch('Indeed', '有料求人媒体', 'active', 50000, '#2557A7', 'indeed', { secret: 'demo-indeed-secret' });
  const cTown   = ch('タウンワーク', '有料求人媒体', 'active', 80000, '#FF6A6A', 'manual', {});
  const cAir    = ch('Airワーク', '無料求人媒体', 'active', 0, '#F2994A', 'manual', {});
  const cHello  = ch('ハローワーク', 'ハローワーク', 'active', 0, '#2F8F5B', 'manual', {});
  const cOwn    = ch('自社採用サイト', '自社採用サイト', 'active', 0, '#0D1F3C', 'self-site', {});
  const cOmo    = ch('おもてなしHR', '有料求人媒体', 'paused', 60000, '#00A4BD', 'generic-webhook', { secret: 'demo-omo-secret', fieldMap: { name:'candidate_name', email:'mail', tel:'phone', msg:'motivation', jobTitle:'position' } });

  const job = (title, emp, salary, place, desc, req, channelIds) => { const j = { id: uid('j'), title, emp, salary, place, desc, req, status:'open', channelIds, createdAt: Date.now()-86400000*20 }; state.jobs.push(j); return j.id; };
  const jFront = job('フロント・接客スタッフ', '正社員', '月給 23〜28万円', '京都市下京区（京都駅より徒歩5分）', 'チェックイン・チェックアウト対応、館内案内、予約管理を担当いただきます。英語での接客歓迎、未経験からでも先輩がしっかりサポートします。', '未経験可／おもてなしに興味のある方', [cIndeed, cTown, cOwn, cHello]);
  const jClean = job('客室清掃スタッフ', 'パート・アルバイト', '時給 1,150円〜', '京都市下京区（京都駅より徒歩5分）', '客室の清掃・ベッドメイキング。短時間勤務・扶養内OK、シフト相談可。', '未経験歓迎／シニア活躍中', [cAir, cTown, cHello]);
  const jCook  = job('調理補助', 'パート・アルバイト', '時給 1,200円〜', '京都市下京区（京都駅より徒歩5分）', '朝夕の料理の盛り付け・下ごしらえ・洗い場など。板前のもとで学べます。', '未経験可', [cIndeed, cAir]);
  const jRsv   = job('予約・電話対応スタッフ', '契約社員', '月給 20〜24万円', '京都市下京区（一部在宅可）', '電話・メール・OTAサイトの予約管理。PC基本操作ができる方歓迎。', 'PC基本操作／接客経験優遇', [cOwn, cIndeed]);

  const app = (name, jobId, chId, status, days, email, tel, msg) => state.apps.push({ id: uid('a'), name, jobId, channelId: chId, status, email, tel, msg, memo:'', appliedAt: Date.now()-86400000*days });
  app('田中 美咲', jFront, cIndeed, 'interview', 5, 'tanaka@example.com', '090-1234-5678', '接客業の経験を活かして、地域に根ざした宿で働きたいです。', );
  app('佐藤 健一', jCook, cAir, 'new', 1, 'sato@example.com', '080-2222-3333', '調理の世界に挑戦したいです。');
  app('鈴木 里奈', jFront, cTown, 'screening', 3, 'suzuki@example.com', '070-4444-5555', '未経験ですが、おもてなしを学びたいです。');
  app('高橋 由美', jClean, cHello, 'offer', 9, 'takahashi@example.com', '090-6666-7777', '地元で長く働ける職場を探しています。');
  app('伊藤 翔',   jFront, cTown, 'new', 0, 'ito@example.com', '080-8888-9999', 'ホテルでのフロント経験があります。');
  app('渡辺 彩',   jRsv, cOwn, 'screening', 4, 'watanabe@example.com', '070-1111-2222', '予約管理の実務経験があります。在宅勤務にも興味があります。');
  app('山本 大輔', jClean, cTown, 'rejected', 12, 'yamamoto@example.com', '090-3333-1111', '');
  app('中村 花子', jCook, cIndeed, 'interview', 6, 'nakamura@example.com', '080-5555-6666', '朝の時間帯で働きたいです。');
  app('小林 誠',   jFront, cIndeed, 'new', 2, 'kobayashi@example.com', '070-7777-8888', '接客が好きです。京都で働きたく、駅近の勤務地に惹かれました。');
  save();
}

/* ---------- helpers ---------- */
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name) { return (name||'?').trim().charAt(0); }
function yen(n) { return '¥' + (n||0).toLocaleString('ja-JP'); }
function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function relDate(ts) {
  const diff = Date.now() - ts, day = 86400000;
  if (diff < day) return '今日';
  if (diff < day*2) return '昨日';
  if (diff < day*7) return Math.floor(diff/day) + '日前';
  return fmtDate(ts);
}
function getChannel(id) { return state.channels.find(c => c.id === id); }
function getJob(id) { return state.jobs.find(j => j.id === id); }
function appsOf(pred) { return state.apps.filter(pred); }
function channelMetrics(c) {
  const apps = state.apps.filter(a => a.channelId === c.id);
  const hires = apps.filter(a => a.status === 'offer').length;
  const openJobs = state.jobs.filter(j => j.status==='open' && j.channelIds.includes(c.id)).length;
  return {
    apps: apps.length, hires, openJobs, cost: c.cost||0,
    cpa: apps.length ? Math.round((c.cost||0)/apps.length) : null,
    cph: hires ? Math.round((c.cost||0)/hires) : null,
  };
}
function totals() {
  const active = state.channels.filter(c => c.status==='active').length;
  const openJobs = state.jobs.filter(j => j.status==='open').length;
  const newApps = state.apps.filter(a => a.status==='new').length;
  const inProc = state.apps.filter(a => ['new','screening','interview'].includes(a.status)).length;
  const offers = state.apps.filter(a => a.status==='offer').length;
  const monthlyCost = state.channels.filter(c=>c.status==='active').reduce((s,c)=>s+(c.cost||0),0);
  return { channels: state.channels.length, active, openJobs, apps: state.apps.length, newApps, inProc, offers, monthlyCost };
}

/* ---------- toast ---------- */
function toast(msg) {
  const t = el(`<div class="toast"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>${esc(msg)}</span></div>`);
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ============================================================
   ROUTER
   ============================================================ */
function setView(v, opts={}) {
  view = v;
  if (opts.chId !== undefined) currentChId = opts.chId;
  if (opts.tab) currentTab = opts.tab;
  if (opts.appCh !== undefined) appChFilter = opts.appCh;
  render();
  document.querySelector('.main').scrollTo(0,0); window.scrollTo(0,0);
}

function render() {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view || (view==='chDetail' && n.dataset.view==='channels'));
  });
  const t = totals();
  document.getElementById('badge-ch').textContent = t.active;
  document.getElementById('badge-jobs').textContent = t.openJobs;
  document.getElementById('badge-apps').textContent = t.newApps;
  document.getElementById('brandName').textContent = state.ryokan.name || 'ひふみ旅館';

  const titles = {
    dashboard: ['ダッシュボード','採用活動の全体状況'],
    channels: ['求人媒体','掲載チャネルと費用対効果の管理'],
    jobs: ['求人','募集職種と掲載媒体の管理'],
    applicants: ['応募者','全媒体からの応募を一元管理'],
    settings: ['設定','旅館情報とデータ管理'],
    chDetail: ['求人媒体 詳細',''],
  };
  const tt = titles[view] || ['',''];
  document.getElementById('topTitle').textContent = tt[0];
  document.getElementById('topSub').textContent = tt[1];

  const c = document.getElementById('content');
  if (view==='dashboard') c.innerHTML = viewDashboard();
  else if (view==='channels') c.innerHTML = viewChannels();
  else if (view==='jobs') c.innerHTML = viewJobs();
  else if (view==='applicants') c.innerHTML = viewApplicants();
  else if (view==='settings') c.innerHTML = viewSettings();
  else if (view==='chDetail') c.innerHTML = viewChannelDetail();
  bindDynamic();
}

/* ---------- shared bits ---------- */
function statusBadge(st) { const s = STATUS[st]; return `<span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span>`; }
function chStatusBadge(st) { const s = CH_STATUS[st]; return `<span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span>`; }
function chDot(c) { return c ? `<span class="job-ch-dot" style="background:${c.color}"></span>` : ''; }
function emptyMini(msg) { return `<div style="text-align:center;padding:40px 0;color:var(--gray);font-size:13px;">${esc(msg)}</div>`; }
function connMeta(t) { return CONNECTORS[t] || CONNECTORS.manual; }
function connBadge(c) { return connMeta(c.connector).auto
  ? '<span class="badge b-active" style="font-size:10px"><span class="dot"></span>自動連携</span>'
  : '<span class="badge b-paused" style="font-size:10px"><span class="dot"></span>手動</span>'; }
function apiOrigin() { return (apiMode && location.protocol.startsWith('http')) ? location.origin : 'http://localhost:8787'; }

/* ---------- DASHBOARD ---------- */
function viewDashboard() {
  const t = totals();
  const recent = [...state.apps].sort((a,b)=>b.appliedAt-a.appliedAt).slice(0,6);
  const maxApps = Math.max(1, ...state.channels.map(c => channelMetrics(c).apps));

  return `
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">稼働中の求人媒体</div><div class="kpi-value">${t.active}<small>/ ${t.channels}</small></div><div class="kpi-foot">月額掲載費 ${yen(t.monthlyCost)}</div></div>
    <div class="kpi"><div class="kpi-label">公開中の求人</div><div class="kpi-value">${t.openJobs}<small>件</small></div><div class="kpi-foot">複数媒体に横断掲載</div></div>
    <div class="kpi"><div class="kpi-label">応募総数</div><div class="kpi-value">${t.apps}<small>名</small></div><div class="kpi-foot">選考中 ${t.inProc}名 ・ 内定 ${t.offers}名</div></div>
    <div class="kpi"><div class="kpi-label">未対応の新規応募</div><div class="kpi-value" style="color:${t.newApps?'var(--red)':'var(--navy)'}">${t.newApps}<small>名</small></div><div class="kpi-foot">${t.newApps?'確認が必要です':'すべて対応済み'}</div></div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-head"><div><h3>媒体別 応募数</h3><div class="sub">どの媒体から応募が来ているか</div></div><button class="btn btn-ghost btn-sm" data-nav="channels">媒体を管理 →</button></div>
      <div class="panel-body" style="padding:18px 22px 20px;">
        ${state.channels.length ? state.channels.map(c => {
          const m = channelMetrics(c);
          return `<div class="bar-row" data-ch="${c.id}" style="cursor:pointer">
            <span class="bl"><span class="job-ch-dot" style="background:${c.color}"></span>${esc(c.name)}</span>

function renderConnPanel(c) {
  const meta = connMeta(c.connector);
  const origin = apiOrigin();
  let inner = '';
  if (c.connector === 'self-site') {
    inner = `<div class="ci-h">応募フォームURL（自社採用サイト）</div>
      <div class="ci-row"><code>${origin}/apply.html</code><button class="btn btn-outline btn-sm" data-copy="${origin}/apply.html">コピー</button></div>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <a class="btn btn-navy btn-sm" href="${origin}/apply.html" target="_blank" rel="noopener">応募フォームを開く</a>
        <button class="btn btn-outline btn-sm" data-testapply>テスト応募を送信</button>
      </div>
      <div class="hint" style="margin-top:10px">このフォームからの応募は、自動でこの媒体として選考パイプラインに追加されます（#1）。</div>`;
  } else if (meta.auto) {
    const secret = (c.config && c.config.secret) || '（未設定）';
    inner = `<div class="ci-h">Webhook 受信URL（${esc(meta.label)}）</div>
      <div class="ci-row"><code>${origin}/api/webhooks/${esc(c.id)}</code><button class="btn btn-outline btn-sm" data-copy="${origin}/api/webhooks/${esc(c.id)}">コピー</button></div>
      <div class="ci-h" style="margin-top:14px">受信シークレット（x-webhook-secret ヘッダ）</div>
      <div class="ci-row"><code>${esc(secret)}</code></div>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-navy btn-sm" data-simulate="${c.id}">テスト受信（シミュレート）</button>
      </div>
      <div class="hint" style="margin-top:10px">${c.connector==='indeed'
        ? 'Indeed のパートナー審査後、Apply/Disposition Webhook をこのURLへ向けると応募が自動取り込みされます（#4）。'
        : '送信側から上記URLへ、x-webhook-secret ヘッダ付きでPOSTすると自動取り込みされます（#4）。'}</div>`;
  } else {
    inner = `<div class="hint" style="margin:0">この媒体は「手動入力」です。応募は「応募者を手動追加」やCSV等で登録します。<br>自動連携するには「媒体設定」から連携方法を変更してください。</div>`;
  }
  const warn = apiMode ? '' : `<div class="hint" style="margin-top:12px;color:var(--warn)">※ テスト送信・自動取り込みはバックエンド起動時（<code style="padding:2px 6px">node server/server.js</code>）に有効になります。現在はローカル保存モードです。</div>`;
  return `<div class="panel" style="margin-bottom:20px;"><div class="panel-head"><div><h3>API連携</h3><div class="sub">${esc(meta.label)}</div></div>${connBadge(c)}</div><div class="panel-body" style="padding:18px 22px 20px;"><div class="conn-info" style="margin:0">${inner}</div>${warn}</div></div>`;
}

function openModal(html) {
  const ov = document.getElementById('overlay');
  ov.innerHTML = html; ov.classList.add('show');
  const f = ov.querySelector('input,select,textarea'); if (f) setTimeout(()=>f.focus(),60);
}
function closeModal() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('show');
  setTimeout(()=>{ if(!ov.classList.contains('show')) ov.innerHTML=''; }, 220);
}

  </div>`);

  let picked = color;
  function renderExtra() {
    const conn = document.getElementById('c-conn').value;
    const box = document.getElementById('c-conn-extra');
    const meta = connMeta(conn);
    if (!meta.auto) { box.innerHTML = `<div class="hint" style="margin:-8px 0 18px">この媒体は自動連携なし。応募は「応募者を手動追加」やCSV等で登録します。</div>`; return; }
    const origin = apiOrigin();
    if (conn === 'self-site') {
      box.innerHTML = `<div class="conn-info"><div class="ci-h">自社採用サイトの応募フォーム</div><div class="ci-row"><code>${origin}/apply.html</code></div><div class="hint">このURLの応募フォームから送信された応募が、自動でこの媒体として取り込まれます。</div></div>`;
      return;
    }
    const url = isEdit ? `${origin}/api/webhooks/${c.id}` : '保存後に発行されます';
    box.innerHTML = `<div class="conn-info">
      <div class="ci-h">Webhook 受信URL</div>
      <div class="ci-row"><code>${esc(url)}</code></div>
      <div class="field" style="margin:14px 0 0"><label>受信シークレット</label>

        <div class="hint">${conn==='indeed'?'Indeed Apply 連携時、この値を x-webhook-secret ヘッダで検証します。':'送信側で x-webhook-secret ヘッダにこの値を設定してください。'}${isEdit?'':' ※ Webhook URLは保存後に確定します。'}</div>
      </div>
    </div>`;

    const config = Object.assign({}, c && c.config ? c.config : {});
    if (connMeta(conn).auto && conn !== 'self-site') config.secret = secret;
    const data = { name, kind: document.getElementById('c-kind').value, status: document.getElementById('c-status').value, cost: parseInt(document.getElementById('c-cost').value,10)||0, note: document.getElementById('c-note').value.trim(), color: picked, connector: conn, config };
    if (isEdit) { Object.assign(c, data); toast('媒体を更新しました'); save(); closeModal(); render(); }

  });
}

function bindStatic() {
  document.getElementById('nav').addEventListener('click', e => { const b=e.target.closest('.nav-item'); if(!b)return; setView(b.dataset.view); document.getElementById('sidebar').classList.remove('open'); document.querySelector('.scrim')?.remove(); });
  document.getElementById('quickAdd').addEventListener('click', () => channelFormModal(null));
  document.getElementById('globalSearch').addEventListener('input', e => { searchTerm=e.target.value.trim().toLowerCase(); if(['channels','jobs','applicants'].includes(view)) render(); else if(searchTerm) setView('applicants'); });
  document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay'||e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
  document.getElementById('menuBtn').addEventListener('click', () => { const sb=document.getElementById('sidebar'); sb.classList.add('open'); const s=el('<div class="scrim"></div>'); s.addEventListener('click',()=>{sb.classList.remove('open');s.remove();}); document.body.appendChild(s); });
  document.getElementById('refreshBtn').addEventListener('click', () => refreshFromApi(false));
}

function bindDynamic() {
  const c = document.getElementById('content');
  c.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => setView(b.dataset.nav));
  c.querySelectorAll('[data-nav-job]').forEach(b => b.onclick = () => { setView('jobs'); });
  c.querySelectorAll('[data-ch]').forEach(b => b.onclick = (e) => { if(e.target.closest('[data-editch]'))return; setView('chDetail', { chId: b.dataset.ch }); });
  c.querySelectorAll('[data-chfilter]').forEach(b => b.onclick = () => { chFilter=b.dataset.chfilter; render(); });
  c.querySelectorAll('[data-appfilter]').forEach(b => b.onclick = () => { appChFilter=b.dataset.appfilter; render(); });
  c.querySelectorAll('[data-appview]').forEach(b => b.onclick = () => setView('applicants', { appCh: b.dataset.appview }));
  c.querySelectorAll('[data-newch]').forEach(b => b.onclick = () => channelFormModal(null));
  c.querySelectorAll('[data-editch]').forEach(b => b.onclick = (e) => { e.stopPropagation(); channelFormModal(b.dataset.editch); });
  c.querySelectorAll('[data-newjob]').forEach(b => b.onclick = () => jobFormModal(null));
  c.querySelectorAll('[data-editjob]').forEach(b => b.onclick = () => jobFormModal(b.dataset.editjob));
  c.querySelectorAll('[data-deljob]').forEach(b => b.onclick = () => { const j=getJob(b.dataset.deljob); if(confirm(`求人「${j.title}」を削除しますか？関連する応募者データも削除されます。`)){ state.jobs=state.jobs.filter(x=>x.id!==j.id); state.apps=state.apps.filter(a=>a.jobId!==j.id); save(); render(); toast('求人を削除しました'); }});
  c.querySelectorAll('[data-app]').forEach(b => b.onclick = () => appDetailModal(b.dataset.app));
  c.querySelectorAll('[data-newapp]').forEach(b => b.onclick = () => appFormModal());
  c.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const t=b.dataset.copy; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('URLをコピーしました')).catch(()=>toast(t)); } else toast(t); });
  c.querySelectorAll('[data-simulate]').forEach(b => b.onclick = async () => { if(!apiMode){toast('バックエンド起動時に利用できます');return;} b.disabled=true; try{ const r=await fetch('/api/channels/'+b.dataset.simulate+'/simulate',{method:'POST'}); const d=await r.json(); if(d.ok){ await refreshFromApi(true); toast('テスト応募を受信しました：'+d.applicant.name); } else toast(d.error||'受信に失敗しました'); }catch(e){ toast('通信に失敗しました'); } b.disabled=false; });
  c.querySelector('[data-testapply]')?.addEventListener('click', async () => { if(!apiMode){toast('バックエンド起動時に利用できます');return;} try{ const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'テスト 応募者',email:'test@example.com',msg:'自社フォームからのテスト応募です'})}); const d=await r.json(); if(d.ok){ await refreshFromApi(true); toast('自社フォームからのテスト応募を受信しました'); } else toast(d.error||'失敗しました'); }catch(e){ toast('通信に失敗しました'); } });

  c.querySelector('[data-savesettings]')?.addEventListener('click', () => { state.ryokan.name=document.getElementById('set-name').value.trim()||'ひふみ旅館'; state.ryokan.area=document.getElementById('set-area').value.trim(); state.ryokan.copy=document.getElementById('set-copy').value.trim(); save(); render(); toast('基本情報を保存しました'); });
  c.querySelector('[data-export]')?.addEventListener('click', doExport);
  c.querySelector('[data-import]')?.addEventListener('click', () => document.getElementById('importFile').click());
  c.querySelector('#importFile')?.addEventListener('change', doImport);
  c.querySelector('[data-reseed]')?.addEventListener('click', () => { if(confirm('サンプルデータに戻します。現在のデータは失われます。よろしいですか？')){ seed(); setView('dashboard'); toast('サンプルデータに初期化しました'); }});
  c.querySelector('[data-wipe]')?.addEventListener('click', () => { if(confirm('すべてのデータを削除します。取り消せません。よろしいですか？')){ state={seq:1,ryokan:{name:'ひふみ旅館',area:'',copy:''},channels:[],jobs:[],apps:[]}; save(); setView('dashboard'); toast('全データを削除しました'); }});
}

function doExport() {
  const blob = new Blob([JSON.stringify(state,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`hifumi-saiyo-${fmtDate(Date.now()).replace(/\./g,'')}.json`; a.click(); URL.revokeObjectURL(url);
  toast('データを書き出しました');
}
function doImport(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ try { const data=JSON.parse(reader.result); if(!data.channels||!data.apps) throw new Error('形式が不正です'); state=data; if(!state.seq)state.seq=1; if(!state.ryokan)state.ryokan={name:'ひふみ旅館',area:'',copy:''}; save(); setView('dashboard'); toast('データを読み込みました'); } catch(err){ toast('読み込みに失敗しました：'+err.message); } };
  reader.readAsText(file);
}

/* ============================================================
   API 連携 / 初期化
   バックエンド（server/server.js）が起動していれば自動的に接続し、
   データはサーバー（SQLite）を正とする。未起動ならローカル保存で動作。
   ============================================================ */
async function apiGet(path) { const r = await fetch(path, { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }

let _pushPending = false, _pushAgain = false;
async function pushState() {
  if (_pushPending) { _pushAgain = true; return; }
  _pushPending = true;
  try { await fetch('/api/state', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ryokan: state.ryokan, channels: state.channels, jobs: state.jobs, apps: state.apps }) }); } catch (e) {}
  _pushPending = false;
  if (_pushAgain) { _pushAgain = false; pushState(); }
}
function normLoaded(s) { return { seq: state.seq || 1, ryokan: s.ryokan || { name:'ひふみ旅館', area:'', copy:'' }, channels: s.channels || [], jobs: s.jobs || [], apps: s.apps || [] }; }
function setConnBadge() {
  const p = document.getElementById('connPill'); const rb = document.getElementById('refreshBtn');
  if (!p) return;
  if (apiMode) { p.className = 'conn-pill on'; p.innerHTML = '<span class="cd"></span>サーバー接続中'; if (rb) rb.style.display = 'inline-flex'; }
  else { p.className = 'conn-pill'; p.innerHTML = '<span class="cd"></span>ローカル保存'; if (rb) rb.style.display = 'none'; }
}
async function refreshFromApi(silent) {
  if (!apiMode) return false;
  try { const s = await apiGet('/api/state'); const before = JSON.stringify(state.apps); state = normLoaded(s); render(); if (!silent) toast('最新の状態に更新しました'); return before !== JSON.stringify(state.apps); }
  catch (e) { if (!silent) toast('更新に失敗しました'); return false; }
}
function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  if (!apiMode) return;
  pollTimer = setInterval(async () => {
    if (document.getElementById('overlay').classList.contains('show')) return; // 編集中は中断
    try { const s = await apiGet('/api/state'); if (JSON.stringify(s.apps) !== JSON.stringify(state.apps) || JSON.stringify(s.channels) !== JSON.stringify(state.channels) || JSON.stringify(s.jobs) !== JSON.stringify(state.jobs)) { state = normLoaded(s); render(); } } catch (e) {}
  }, 10000);
}
async function init() {
  try { const h = await fetch('/api/health', { cache:'no-store' }); if (h.ok) { apiMode = true; const s = await apiGet('/api/state'); state = normLoaded(s); } }
  catch (e) { apiMode = false; }
  if (!apiMode) { if (!load()) seed(); }
  bindStatic(); render(); setConnBadge(); startPoll();
}
init();
</script>
