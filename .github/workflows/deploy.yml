name: Deploy to GitHub Pages

# main ブランチに変更が入るたびに自動でサイトを公開します。
# 一度設定すれば、あなたのPCの電源に関係なく GitHub がサイトを24時間配信します。
on:
  push:
    branches:
      - main
  # 手動でも実行できるようにしておきます（Actions タブの Run workflow ボタン）
  workflow_dispatch:

# GitHub Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理は同時に1つだけ実行する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定
        uses: actions/configure-pages@v5

      - name: サイトのファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリのルート（index.html がある場所）をそのまま公開
          path: .

      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
